<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CM1/TEU 계산기</title>
<style>
  :root{--bg:#eef1f6;--panel:#ffffff;--panel2:#f3f6fa;--line:#dde4ee;--tx:#26303d;--mut:#6b7a8d;
        --accent:#2f6fed;--good:#1f9d57;--warn:#b9710a;--bad:#d83a3a;--head:#ffffff;--zebra:#f8fafc;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 -apple-system,"Malgun Gothic",sans-serif}
  header{padding:13px 22px;background:var(--head);border-bottom:1px solid var(--line);display:flex;
         align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:20;box-shadow:0 1px 4px rgba(40,60,90,.05)}
  h1{font-size:16px;margin:0;font-weight:800;letter-spacing:-.2px}
  .gtabs{display:flex;gap:6px}
  .gtab{padding:7px 18px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--mut);cursor:pointer;font-weight:700}
  .gtab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .hinfo{margin-left:auto;color:var(--mut);font-size:12px;display:flex;gap:10px;align-items:center}
  .hinfo a{color:var(--mut);cursor:pointer;text-decoration:underline dotted}
  .layout{display:flex;gap:16px;padding:16px 22px;max-width:1720px;margin:0 auto;align-items:flex-start}
  .wrap{flex:1;min-width:0}
  .fseg{color:var(--mut);font-size:12px;font-weight:700}
  select{background:var(--panel);border:1px solid var(--line);color:var(--tx);padding:6px 10px;border-radius:8px;font-size:13px;cursor:pointer;min-width:90px}
  select:focus{outline:2px solid #cfe0fb;border-color:var(--accent)}
  .ctrls{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:14px;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:11px 16px;box-shadow:0 1px 3px rgba(40,60,90,.06)}
  .pbtn{padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--mut);cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap}
  .pbtn:hover{border-color:var(--accent);color:var(--accent)}
  .pbtn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .pbtn.go{border-color:var(--accent);color:var(--accent);font-weight:800;padding:6px 16px}
  .pbtn.go.on{background:var(--accent);color:#fff;box-shadow:0 0 0 3px rgba(47,111,237,.18)}
  .muted{color:var(--mut)}.neg{color:var(--bad);font-weight:800}
  table{width:100%;border-collapse:separate;border-spacing:0;background:var(--panel);border-radius:12px;box-shadow:0 1px 3px rgba(40,60,90,.07)}
  th,td{padding:8px 10px;text-align:center;border-bottom:1px solid var(--line);border-right:1px solid var(--line);font-variant-numeric:tabular-nums}
  th{background:var(--panel2);color:var(--mut);font-size:11.5px;font-weight:700;letter-spacing:.2px}
  th:last-child,td:last-child{border-right:none}
  th:first-child,td:first-child{text-align:left}
  tbody tr:last-child td{border-bottom:none}
  tr.grp td{background:var(--zebra);font-size:11.5px;font-weight:700;color:var(--mut)}
  tr.grp td:first-child{padding-left:8px}
  td.sub{padding-left:22px;font-size:12.5px}
  .sect-t{font-size:14px;font-weight:800;margin:20px 0 9px}
  .note{color:var(--mut);font-size:12px;margin-top:8px}
  .calc-head{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:800;margin:4px 0 8px;flex-wrap:wrap}
  .calc-head .ar{color:var(--mut);font-weight:600}
  .calc-head .badge{background:var(--accent);color:#fff;font-size:12px;font-weight:800;padding:2px 9px;border-radius:6px}
  .calc-head .pn{font-size:12px;font-weight:500;color:var(--mut)}
  .route{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12.5px;color:var(--mut);margin:0 0 12px;padding:7px 12px;background:var(--panel);border:1px solid var(--line);border-radius:9px}
  .route b{color:var(--tx)}
  .route .lg{display:inline-flex;align-items:center;gap:4px}
  .route .kd{font-size:10.5px;font-weight:700;padding:0 6px;border-radius:5px;background:#e8eef9;color:#2f5bb7}
  .route .kd.f{background:#fdf3e3;color:#b9710a}
  .route .kd.t{background:#eaf5ee;color:#1f7a45}
  .route .ts{margin-left:auto;font-weight:700}
  .wf{display:flex;align-items:stretch;gap:6px;flex-wrap:wrap;background:#f7f9fc;border:1px solid #e3e8ef;border-radius:10px;padding:12px 14px;margin-bottom:6px}
  .wf-i{flex:1;min-width:88px;text-align:center;padding:4px 6px}
  .wf-k{font-size:11px;color:var(--mut);font-weight:600;margin-bottom:3px}
  .wf-v{font-size:17px;font-weight:800}
  .wf-s{font-size:10.5px;color:var(--warn);font-weight:700;margin-top:2px}
  .wf-op{display:flex;align-items:center;color:var(--mut);font-size:16px;font-weight:700;padding:0 2px}
  .wf-cm{background:rgba(37,99,235,.08);border-radius:8px}
  .wf-cm .wf-v{color:var(--accent)}
  .wf-cm.neg .wf-v{color:#dc2626}
  .bench{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;background:rgba(10,125,50,.06);border:1px solid rgba(10,125,50,.18);border-radius:9px;padding:9px 13px;margin-bottom:8px;flex-wrap:wrap}
  .sha-ref{background:#eef5ff;border:1px solid #bcd4f5;border-radius:9px;padding:10px 13px;margin-bottom:8px;font-size:13px}
  .sha-ref .sr-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:700}
  .sha-ref .sr-badge{background:#1e5fbf;color:#fff;font-size:12px;font-weight:800;padding:2px 8px;border-radius:6px}
  .sha-ref .sr-org{margin-left:auto;font-weight:600;font-size:12px;color:var(--mut)}
  .sha-ref .sr-f{display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap;margin-top:8px}
  .sha-ref .sr-f .op{color:var(--mut);font-weight:700}
  .sha-ref .sr-cm{font-size:18px;font-weight:800}
  .sha-ref .sr-rmk{font-size:11px;color:var(--mut);margin-top:7px;line-height:1.45}
  .sha-ref.empty{background:#f6f7f9;border-color:var(--line)}
  .loading{color:var(--mut);padding:24px;text-align:center}
  .cond{display:inline-block;margin-left:5px;font-size:10px;font-weight:700;color:#b9710a;background:#fdf3e3;border-radius:5px;padding:0 5px;vertical-align:1px}
  .cols{display:flex;gap:18px;flex-wrap:wrap;margin-top:6px}
  .cols>div{flex:1;min-width:240px}
  .cols>div.wide{flex:1.4;min-width:300px}
  input[type=number]{width:96px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;font-size:13px}
  #foot{color:var(--mut);font-size:11.5px;margin-top:22px;line-height:1.6}
  /* 검색 콤보박스 */
  .cb{position:relative;display:inline-block}
  .cb input{width:100%;padding:6px 22px 6px 9px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:var(--panel);color:var(--tx)}
  .cb input:focus{outline:2px solid #cfe0fb;border-color:var(--accent)}
  .cb::after{content:"▾";position:absolute;right:8px;top:6px;color:var(--mut);pointer-events:none;font-size:12px}
  .cb-list{display:none;position:absolute;left:0;top:calc(100% + 3px);min-width:100%;width:max-content;max-width:320px;max-height:300px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:9px;box-shadow:0 8px 24px rgba(30,45,70,.14);z-index:30;padding:4px}
  .cb.open .cb-list{display:block}
  .cb-it{padding:5px 9px;border-radius:6px;cursor:pointer;font-size:13px;display:flex;gap:8px;align-items:baseline;white-space:nowrap}
  .cb-it .sub{color:var(--mut);font-size:11.5px}
  .cb-it.hl{background:#e8eef9}
  .cb-it.cur{font-weight:700}
  .cb-none{padding:6px 9px;color:var(--mut);font-size:12px}
  .cb.ctr{width:78px}.cb.port{width:176px}
  /* 좌측 이력 패널 */
  aside{width:272px;flex:none;position:sticky;top:76px;max-height:calc(100vh - 92px);display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:11px;box-shadow:0 1px 3px rgba(40,60,90,.06)}
  .hs-h{display:flex;align-items:center;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line);font-weight:800;font-size:13px}
  .hs-h .n{color:var(--mut);font-weight:600;font-size:11.5px}
  .hs-h .sp{margin-left:auto}
  .hs-h .mini{font-size:11px;padding:3px 8px;border:1px solid var(--line);border-radius:6px;color:var(--mut);cursor:pointer;background:var(--panel)}
  .hs-h .mini:hover{color:var(--accent);border-color:var(--accent)}
  .hs-h .mini.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .hs-l{overflow:auto;padding:6px}
  .hi{padding:7px 9px;border-radius:8px;cursor:pointer;border:1px solid transparent;position:relative}
  .hi:hover{background:var(--panel2)}
  .hi.cur{border-color:#cfe0fb;background:#f2f6ff}
  .hi .l1{display:flex;align-items:center;gap:6px;font-weight:700;font-size:13px}
  .hi .l1 .ty{font-size:10.5px;font-weight:800;color:#fff;background:#8a97ab;border-radius:5px;padding:0 6px}
  .hi .l2{display:flex;align-items:baseline;gap:8px;font-size:11.5px;color:var(--mut);margin-top:2px}
  .hi .l2 b{font-size:14px;color:var(--good)}
  .hi .l2 b.neg{color:var(--bad)}
  .hi .act{position:absolute;right:6px;top:6px;display:none;gap:2px}
  .hi:hover .act,.hi.pin .act{display:flex}
  .hi .act span{font-size:12px;padding:0 4px;border-radius:5px;color:var(--mut);cursor:pointer;background:var(--panel)}
  .hi .act span:hover{color:var(--accent)}
  .hi.pin .act .pn{color:var(--warn);display:inline}
  .hi .flag{display:inline-block;font-size:10px;font-weight:700;padding:0 5px;border-radius:5px;background:#fdf3e3;color:#b9710a}
  .hs-empty{color:var(--mut);font-size:12px;padding:16px 12px;line-height:1.6}
  .hs-f{padding:7px 12px;border-top:1px solid var(--line);font-size:11px;color:var(--mut);line-height:1.5}
  /* 비교표 */
  .cmp{margin-bottom:14px}
  .cmp table td,.cmp table th{padding:6px 8px;font-size:12.5px}
  .cmp .best{background:rgba(31,157,87,.10);font-weight:800;color:var(--good)}
  .cmp .worst{color:var(--bad)}
  .cmp .tools{display:flex;gap:6px;align-items:center;margin-bottom:8px;font-size:12px;color:var(--mut)}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#26303d;color:#fff;padding:8px 16px;border-radius:9px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
  .toast.on{opacity:1}
  @media (max-width:980px){ .layout{flex-direction:column} aside{width:100%;position:static;max-height:260px} }
</style>

<body>
<div id=gate style="position:fixed;inset:0;z-index:100;background:#f6f7f9;display:flex;align-items:center;justify-content:center"><div style="text-align:center;max-width:360px;padding:20px"><div style="font-size:44px">🧮</div><h2 style="margin:6px 0">CM1/TEU 계산기</h2><p style="color:#697488;font-size:13px">ekmtc.com 계정으로 로그인하세요.</p><button id=loginBtn onclick=signIn() disabled style="margin-top:8px;padding:9px 20px;border:0;border-radius:8px;background:#1e40af;color:#fff;font:600 14px sans-serif;cursor:pointer">구글 로그인</button><div id=gerr style="color:#b91c1c;font-size:12px;margin-top:10px"></div></div></div>
<header>
  <h1>CM1/TEU 계산기</h1>
  <div class="gtabs">
    <div class="gtab" data-g="DRY">DRY (GP/HC)</div>
    <div class="gtab" data-g="FROT">FR / OT</div>
    <div class="gtab" data-g="RF">RF / RH</div>
  </div>
  <div class="hinfo"><span id="built"></span><a onclick="logout()">로그아웃</a></div>
</header>
<div class="layout">
<aside id="hist">
  <div class="hs-h">📋 조회 이력 <span class="n" id="hs-n"></span>
    <span class="sp"></span>
    <span class="mini" id="hs-cmp" title="이력 구간을 한 표로 비교">비교표</span>
    <span class="mini" id="hs-clear" title="고정(★) 제외 전부 삭제">지우기</span></div>
  <div class="hs-l" id="hs-l"></div>
  <div class="hs-f">조회 버튼을 누른 구간만 저장(이 브라우저). 클릭=같은 조건 복원(O/F·Waive 포함) · ★=고정 · 최근 40개 유지</div>
</aside>
<div class="wrap">
  <div class="ctrls">
    <span class="fseg">선적</span><span class="cb ctr" id="c-porc"></span><span class="cb port" id="c-por"></span>
    <span class="muted">→</span>
    <span class="fseg">도착</span><span class="cb ctr" id="c-dlyc"></span><span class="cb port" id="c-dly"></span>
    <select id="c-typ"></select>
    <select id="c-oog" title="OOG 등급 (상해발 참조운임에 반영)"></select>
    <span class="pbtn go" id="c-go" title="선택한 구간·규격으로 조회 (이력에 저장)">🔍 조회</span>
    <span class="fseg">│ O/F($/컨)</span>
    <input type="number" id="c-of">
    <span class="pbtn" id="c-reset-of" title="O/F 입력값을 구간 평균으로 되돌립니다">O/F 기본값</span>
    <span class="pbtn" id="c-link" title="현재 조건이 담긴 링크를 복사(동료에게 전달)">🔗 링크 복사</span>
  </div>
  <div id="cmp-out" class="cmp" style="display:none"></div>
  <div id="calc-out" class="loading">데이터 불러오는 중…</div>
  <div id="foot"></div>
</div>
</div>
<div class="toast" id="toast"></div>
<script>
const BAKED=null;
let DATA=null;
const $=s=>document.querySelector(s);
const fmt=n=>(n||0).toLocaleString();
const opt=(label,val,sel)=>`<option value="${val}"${sel?" selected":""}>${label}</option>`;
const GROUPS={DRY:["20GP","40GP","40HC"],FROT:["20FR","40FR","20OT","40OT"],RF:["20RF","40RH"]};
const S={group:"DRY",cmp:false};
try{ const g=localStorage.getItem("cm1calc_group"); if(GROUPS[g]) S.group=g; }catch(e){}
// SEL = 선택창 상태(콤보/규격/탭), CST = 조회 버튼으로 확정돼 화면에 그려진 상태. 조회 전엔 이전 결과가 그대로 남음.
const SEL={group:S.group,porc:"",por:"",dlyc:"",dly:"",typ:"",oog:"ING"};
const CST={group:S.group,porc:"",por:"",dlyc:"",dly:"",typ:"",oog:"ING",waived:new Set()};
let LAST=null;   // 마지막 렌더 결과(이력 저장용)
// 조건부 청구 항목 — 해당 케이스(서렌더·C/A·EDI·OAF)에만 발생하므로 기본 Waive. 체크 풀면 포함.
const DEFAULT_WAIVE=new Set(["SRD","CCA","EDI","OAF"]);
const CAT_NM={P:"포트 핸들링",F:"피더·내륙 운송",H:"T/S 허브 핸들링"};
const KIND={"01":["본선",""],"02":["피더","f"],"04":["철도","t"],"05":["트럭","t"],"99":["기타","t"]};
const curTypes=()=>GROUPS[SEL.group];
function uniq(a){return [...new Set(a)].sort();}
function laneRows(){ const t=curTypes(); return DATA.lanes.filter(l=>t.includes(l.typ)); }
const pname=p=>(DATA.pnames&&DATA.pnames[p])||"";
function copyText(t,ok){ const done=()=>toast(ok); const fb=()=>{ try{ const ta=document.createElement("textarea"); ta.value=t; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select(); const r=document.execCommand("copy"); ta.remove(); r?done():toast("복사 실패"); }catch(e){ toast("복사 실패"); } };
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done).catch(fb); else fb(); }
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("on"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("on"),1600); }

// ── 검색 콤보박스: 코드/영문명으로 타이핑 검색, ↑↓ Enter Esc, 클릭 ──
function combo(id,items,value,onpick){
  const el=document.getElementById(id);
  if(!el._cb){ el.innerHTML=`<input autocomplete="off" spellcheck="false"><div class="cb-list"></div>`; el._cb={}; }
  const st=el._cb, inp=el.querySelector("input"), list=el.querySelector(".cb-list");
  st.items=items; st.value=value; st.onpick=onpick;
  const disp=()=>{ const it=st.items.find(i=>i.v===st.value); inp.value=it?(it.sub?`${it.label}  ${it.sub}`:it.label):(st.value||""); inp.title=inp.value; };
  disp();
  if(st.bound) return;
  st.bound=true;
  let hl=-1, shown=[];
  const render=(q)=>{
    const qq=(q||"").trim().toLowerCase();
    const it=st.items;
    shown=qq?it.filter(i=>i.label.toLowerCase().startsWith(qq)).concat(it.filter(i=>!i.label.toLowerCase().startsWith(qq)&&(i.label.toLowerCase().includes(qq)||(i.sub||"").toLowerCase().includes(qq)))):it;
    hl=Math.max(0,shown.findIndex(i=>i.v===st.value)); if(qq) hl=0;
    list.innerHTML=shown.length?shown.map((i,k)=>`<div class="cb-it${k===hl?' hl':''}${i.v===st.value?' cur':''}" data-k="${k}">${i.label}${i.sub?`<span class="sub">${i.sub}</span>`:''}</div>`).join(""):`<div class="cb-none">검색 결과 없음</div>`;
    el.classList.add("open");
    const h=list.querySelector(".hl"); if(h) h.scrollIntoView({block:"nearest"});
  };
  const close=()=>{ el.classList.remove("open"); disp(); };
  const pick=k=>{ const it=shown[k]; if(!it) return; el.classList.remove("open"); if(it.v!==st.value){ st.value=it.v; disp(); st.onpick(it.v); } else disp(); };
  inp.onfocus=()=>{ inp.select(); render(""); };
  inp.oninput=()=>render(inp.value);
  inp.onkeydown=e=>{
    if(e.key==="ArrowDown"){ e.preventDefault(); if(!el.classList.contains("open")) return render(inp.value); hl=Math.min(shown.length-1,hl+1); list.querySelectorAll(".cb-it").forEach((d,k)=>d.classList.toggle("hl",k===hl)); const h=list.querySelector(".hl"); if(h) h.scrollIntoView({block:"nearest"}); }
    else if(e.key==="ArrowUp"){ e.preventDefault(); hl=Math.max(0,hl-1); list.querySelectorAll(".cb-it").forEach((d,k)=>d.classList.toggle("hl",k===hl)); const h=list.querySelector(".hl"); if(h) h.scrollIntoView({block:"nearest"}); }
    else if(e.key==="Enter"){ e.preventDefault(); if(!el.classList.contains("open")){ inp.blur(); query(); return; } pick(hl); inp.blur(); }
    else if(e.key==="Escape"){ close(); inp.blur(); }
    else if(e.key==="Tab"){ if(el.classList.contains("open")&&inp.value.trim()&&shown.length) pick(hl); else close(); }
  };
  inp.onblur=()=>setTimeout(close,120);
  list.onmousedown=e=>{ e.preventDefault(); const d=e.target.closest(".cb-it"); if(d) pick(Number(d.dataset.k)); };
}

// ── 할증 정가 (스냅샷에 압축 저장: 선적(P)/도착(C) 리스트를 인덱스로 공유) ──
function surOf(por,dly,typ){
  const S=DATA.sur; const e=S.idx[por]&&S.idx[por][dly]&&S.idx[por][dly][typ];
  if(!e) return [];
  const mk=(i,pnc)=>(S.lists[i]||[]).map(([code,amt])=>({code,name:S.names[code]||"",pnc,amt}));
  return mk(e[0],"P").concat(mk(e[1],"C"));
}

function syncSelectors(){
  // 선택창만 갱신(콤보 캐스케이드) — 렌더·저장 없음. 조회 버튼이 눌리면 query() 가 SEL→CST 복사 후 렌더
  const L=laneRows();

  } else if(CST.group==="FROT"){

    for(const s of rows){ const w=CST.waived.has(wkey(s));
      const dw=DEFAULT_WAIVE.has(s.code);
      h+=`<tr><td style="text-align:left" class="${w?'muted':''}" title="${s.name||''}${dw?' — 조건부 청구(해당 시에만). 기본 Waive':''}">${s.code} <span class="muted" style="font-size:10px">${(s.name||'').slice(0,16)}</span>${dw?'<span class="cond">조건부</span>':''}</td>
        <td class="${w?'muted':''}">${w?'<s>$'+fmt(s.amt)+'</s>':'$'+fmt(s.amt)}</td>
        <td><input type="checkbox" class="wv" data-code="${wkey(s)}" ${w?'checked':''}></td></tr>`; }
    h+=`<tr><td style="text-align:left"><b>소계</b></td><td><b>$${fmt(sub)}</b></td><td></td></tr></tbody></table>`;
    return h; };
  const so=SU.filter(s=>s.pnc==='P'), sd=SU.filter(s=>s.pnc==='C');
  const ct=costTable(l);
  const subOf=a=>a.filter(s=>!CST.waived.has(wkey(s))).reduce((x,s)=>x+s.amt,0);
  const soSum=subOf(so), sdSum=subOf(sd);
  const step=(k,v,cls,sub)=>`<div class="wf-i ${cls||''}"><div class="wf-k">${k}</div><div class="wf-v">$${fmt(v)}</div>${sub?`<div class="wf-s">${sub}</div>`:''}</div>`;
  const op=s=>`<div class="wf-op">${s}</div>`;
  const notes=(l.notes||[]).map(n=>`<div class="note" style="color:#d97706">⚠ ${n}</div>`).join("");
  $("#calc-out").className="";
  $("#calc-out").innerHTML=`
    <div class="calc-head">${l.por_ctr}/${l.por} <span class="pn">${pname(l.por)}</span> <span class="ar">→</span> ${l.dly_ctr}/${l.dly} <span class="pn">${pname(l.dly)}</span>

      ${bench30?`<span class="muted">· ${bench30.scope} ${fmt(bench30.bls)}컨</span>`:''}`:''}
      <span class="muted" style="margin-left:auto">실적=적재(OBRD) B/L 확정운임−원가 · 아래는 입력 O/F 기준 계산값</span></div>

    <div class="wf">

      ${step("선적 할증", soSum)} ${op("+")}
      ${step("도착 할증", sdSum)} ${op("−")}
      ${step("원가", l.cost, "", ct.tsSum>0?`피더·T/S $${fmt(ct.tsSum)} 포함`:"")} ${op("=")}

      <div>${surTable("⬆ 선적지 할증 (선불)", so)}</div>

      <div class="wide"><div class="sect-t" style="margin-top:10px">원가 <span class="muted" style="font-weight:700">$${fmt(l.cost)}</span> <span class="muted" style="font-weight:500;font-size:11px">자동·비용계정별 · 피더·T/S 포함(레그별 실적)</span></div>${ct.html}</div>

  document.querySelectorAll(".wv").forEach(cb=>cb.onchange=e=>{

// ── 조회 이력 (localStorage) : 조회 버튼 시 저장·클릭 복원·고정·비교표 ──
const HK="cm1calc_hist"; let HIST=[]; let CURKEY="";
try{ HIST=JSON.parse(localStorage.getItem(HK)||"[]"); if(!Array.isArray(HIST)) HIST=[]; }catch(e){ HIST=[]; }
function histSave(){ try{ localStorage.setItem(HK,JSON.stringify(HIST)); }catch(e){} }
function histKey(){ return `${CST.group}|${CST.porc}|${CST.por}|${CST.dlyc}|${CST.dly}|${CST.typ}|${CST.group==="FROT"?CST.oog:""}`; }
function histEntry(){ const r=LAST; return {key:histKey(),g:CST.group,porc:CST.porc,por:CST.por,dlyc:CST.dlyc,dly:CST.dly,typ:CST.typ,oog:CST.oog,
             of:r.ofIn,w:[...CST.waived],so:r.soSum,sd:r.sdSum,cost:r.l.cost,cm1:r.cm1,cm1teu:r.cm1teu,
             bench:r.bench?r.bench.cm1teu:null,ts:r.ts,basis:r.l.basis,t:Date.now()}; }
function histCommit(){
  // 조회 버튼/복원/링크 → 맨 위로 upsert (고정 유지, 미고정 40개)
  if(!LAST) return;
  const e=histEntry(); CURKEY=e.key;
  const i=HIST.findIndex(x=>x.key===e.key);
  if(i>=0){ e.pin=HIST[i].pin; HIST.splice(i,1); }
  HIST.unshift(e);
  const keep=[]; let n=0;
  for(const x of HIST){ if(x.pin) keep.push(x); else if(n<40){ keep.push(x); n++; } }
  HIST=keep; histSave(); histRender(); if(S.cmp) cmpRender();
}
function histUpdate(){
  // O/F·Waive 만 바뀐 경우: 같은 키의 기존 항목 값만 갱신(순서·신규 없음)
  if(!LAST) return;
  CURKEY=histKey();
  const i=HIST.findIndex(x=>x.key===CURKEY);
  if(i>=0){ const pin=HIST[i].pin; HIST[i]=histEntry(); HIST[i].pin=pin; histSave(); if(S.cmp) cmpRender(); }
  histRender();
}
function histRender(){
  const L=$("#hs-l"); $("#hs-n").textContent=HIST.length?`${HIST.length}`:"";
  if(!HIST.length){ L.innerHTML=`<div class="hs-empty">아직 없음.<br>구간을 고르고 <b>조회</b>를 누르면 여기에 쌓이고, 클릭하면 같은 조건(O/F·Waive 포함)으로 돌아갑니다.</div>`; return; }
  const rows=[...HIST].sort((a,b)=>(b.pin?1:0)-(a.pin?1:0));
  L.innerHTML=rows.map(e=>`<div class="hi${e.pin?' pin':''}${e.key===CURKEY?' cur':''}" data-k="${e.key}">
      <div class="l1">${e.por}<span class="muted">→</span>${e.dly}<span class="ty">${e.typ}</span>${e.g==="FROT"&&e.oog!=="ING"?`<span class="flag">${e.oog}</span>`:''}</div>
      <div class="l2"><b class="${e.cm1teu<0?'neg':''}">$${fmt(e.cm1teu)}</b><span>/TEU</span><span>O/F $${fmt(e.of)}</span>${e.bench!=null?`<span title="실적 평균 CM1/TEU">실적 $${fmt(e.bench)}</span>`:''}</div>
      <div class="act"><span class="pn" title="고정">${e.pin?'★':'☆'}</span><span class="rm" title="삭제">✕</span></div></div>`).join("");
  L.querySelectorAll(".hi").forEach(d=>{
    d.onclick=ev=>{ const k=d.dataset.k; const e=HIST.find(x=>x.key===k); if(!e) return;
      if(ev.target.classList.contains("pn")){ e.pin=!e.pin; histSave(); histRender(); return; }
      if(ev.target.classList.contains("rm")){ HIST=HIST.filter(x=>x.key!==k); histSave(); histRender(); if(S.cmp) cmpRender(); return; }
      histRestore(e); };
  });
}
function setGroup(g){ SEL.group=g; try{localStorage.setItem("cm1calc_group",g);}catch(x){} document.querySelectorAll(".gtab").forEach(x=>x.classList.toggle("on",x.dataset.g===g)); }
function histRestore(e){
  setGroup(GROUPS[e.g]?e.g:SEL.group);
  Object.assign(SEL,{porc:e.porc,por:e.por,dlyc:e.dlyc,dly:e.dly,typ:e.typ,oog:e.oog||"ING"});

$("#hs-clear").onclick=()=>{ HIST=HIST.filter(x=>x.pin); histSave(); histRender(); if(S.cmp) cmpRender(); };
$("#hs-cmp").onclick=()=>{ S.cmp=!S.cmp; $("#hs-cmp").classList.toggle("on",S.cmp); $("#cmp-out").style.display=S.cmp?"":"none"; if(S.cmp) cmpRender(); };
function cmpRender(){
  const rows=[...HIST].sort((a,b)=>(b.pin?1:0)-(a.pin?1:0)||b.cm1teu-a.cm1teu);
  if(!rows.length){ $("#cmp-out").innerHTML=`<div class="note">비교할 이력이 없습니다.</div>`; return; }
  const best=Math.max(...rows.map(r=>r.cm1teu)), worst=Math.min(...rows.map(r=>r.cm1teu));
  const h=[`<div class="tools"><b style="color:var(--tx)">📊 이력 구간 비교</b><span>CM1/TEU 높은 순 · 클릭=복원</span>

  for(const r of rows) h.push(`<tr class="hi-row" data-k="${r.key}" style="cursor:pointer">
    <td>${r.pin?'★ ':''}${r.porc}/${r.por} → ${r.dlyc}/${r.dly}</td><td>${r.typ}${r.g==="FROT"&&r.oog!=="ING"?' '+r.oog:''}</td>
    <td>$${fmt(r.of)}</td><td>$${fmt(r.so)}</td><td>$${fmt(r.sd)}</td><td>$${fmt(r.cost)}</td><td class="muted">${r.ts?'$'+fmt(r.ts):'–'}</td>
    <td class="${r.cm1<0?'neg':''}">$${fmt(r.cm1)}</td>
    <td class="${r.cm1teu===best&&rows.length>1?'best':(r.cm1teu===worst&&rows.length>1?'worst':'')}">$${fmt(r.cm1teu)}</td>
    <td class="muted">${r.bench!=null?'$'+fmt(r.bench):'–'}</td><td class="muted" style="font-size:11px">${r.basis==="exact"?"실적":r.basis==="sib"?"형제규격":r.basis&&r.basis.startsWith("port")?"포트분해":r.basis||""}</td></tr>`);
  h.push(`</tbody></table>`);
  $("#cmp-out").innerHTML=h.join("");

    const tsv=[hd.join("\t")].concat(rows.map(r=>[`${r.porc}/${r.por}`,`${r.dlyc}/${r.dly}`,r.typ,r.g==="FROT"?r.oog:"",r.of,r.so,r.sd,r.cost,r.ts||0,r.cm1,r.cm1teu,r.bench??"",r.basis].join("\t"))).join("\n");

function applyHash(){
  if(!location.hash||location.hash.length<3) return false;
  try{ const p=new URLSearchParams(location.hash.slice(1)); if(!p.get("por")||!p.get("dly")) return false;
    if(GROUPS[p.get("g")]) setGroup(p.get("g"));

    async function _afterLogin(){try{var g=await gapi.client.drive.files.get({fileId:SNAP_FILE_ID,alt:'media'});boot(JSON.parse(g.body));}catch(e){_clearTok();_gerr('데이터 로드 실패 — '+(e.message||e));}}
    function logout(){_clearTok();location.reload();}
    
</script>
